[project]
name = "wmar"
version = "0.1.0"
dependencies = [
    "accelerate==1.6.0",
    "compressai==1.2.6",
    "diffusers==0.33.1",
    "einops==0.8.1",
    "loguru==0.7.3",
    "matplotlib==3.10.0",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "open-clip-torch==2.32.0",
    "opencv-python==4.11.0.86",
    "pillow==11.2.1",
    "protobuf==5.29.4",
    "pycryptodome==3.22.0",
    "pytorch-lightning==2.5.1",
    "requests==2.32.3",
    "scikit-image==0.25.2",
    "scikit-learn==1.6.1",
    "sentencepiece>=0.2.1",
    "tabulate==0.9.0",
    "tensorboard==2.19.0",
    "torch-fidelity==0.3.0",
    "torchaudio==2.7.0",
    "torchinfo==1.8.0",
    "torchvision==0.22.0",
    "tqdm==4.67.1",
    "transformers==4.51.3",
    "triton==3.3.0",
    "webdataset==0.2.111",
    "xformers>=0.0.30",
]
[tool.uv.extra-build-dependencies]
xformers = ["torch"]
[tool.uv.sources]
xformers = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
[tool.black]
line-length = 120
preview = true
include = 'wmar/'
[tool.isort]
profile = "black"
skip = [
    "*",
    "!wmar/"
]
[tool.flake8]
max-line-length = 120
extend-ignore = "E203,E501"
max-complexity = 15
exclude = [
    "*",
    "!wmar/"
]
